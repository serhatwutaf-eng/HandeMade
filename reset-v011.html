<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#47705c"><title>HandeMade v0.11 yenileniyor</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f3ec;color:#24352d;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:420px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 16px 50px rgba(40,60,48,.12);text-align:center}.spinner{width:34px;height:34px;border:4px solid #d9e6dd;border-top-color:#47705c;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{width:100%;min-height:48px;border:0;border-radius:16px;background:#47705c;color:#fff;font-weight:750;font-size:16px;margin-top:14px}</style></head><body><div class="card"><div class="spinner"></div><h2>HandeMade v0.11 temizleniyor 🌿</h2><p id="msg">Eski iPhone önbelleği siliniyor ve yeni sürüm açılıyor.</p><button id="go" hidden>v0.11’i aç</button></div><script>(async()=>{const msg=document.getElementById('msg'),go=document.getElementById('go');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}try{localStorage.setItem('handemade-cache-reset','0.11')}catch(e){}msg.textContent='Temizlendi. v0.11 açılıyor…';setTimeout(()=>location.replace('./?v=0.11&fresh='+Date.now()),700)}catch(e){msg.textContent='Otomatik temizlik tamamlanamadı. Aşağıdaki düğmeye dokun.';go.hidden=false;go.onclick=()=>location.replace('./?v=0.11&fresh='+Date.now())}})();</script></body></html>
