<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HandeMade v0.31 yenileniyor</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#f7f3ec;color:#26352e;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    .card{max-width:430px;background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
    .spin{font-size:36px;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="card"><div class="spin">🍲</div><h2>HandeMade yenileniyor</h2><p>Eski önbellek temizleniyor ve büyük tarif motoru v0.31 açılıyor.</p></div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
      }catch(e){console.warn(e)}
      location.replace('./?v=0.31&fresh='+Date.now());
    })();
  </script>
</body>
</html>
